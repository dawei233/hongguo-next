<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 红果 Next 应用图标 · 深色变体「竖屏追剧」记号（夜间剧场：屏幕变暗，播放键亮着） -->
  <!-- 设计令牌（DESIGN-SYSTEM-V2 §3.1.1 brand 色阶）：
       背景 brand-500 #FF7A6E（深色主色）
       记号 on-primary #3B0E07（深色下品牌红变亮，配色翻成深色字）
       下一集帧 brand-900 #FFE0DC
       播放三角 = 背景色透出（品牌红从暗屏后点亮） -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#FF7A6E"/>
  <g transform="rotate(7 458 536)">
    <!-- 下一集帧：brand-900，向右上探出 = 一集接一集（追剧链条 / Next） -->
    <path d="M466,170 L666,170 C710.18,170 746,205.82 746,250 L746,726 C746,770.18 710.18,806 666,806 L466,806 C421.82,806 386,770.18 386,726 L386,250 C386,205.82 421.82,170 466,170 Z" fill="#FFE0DC"/>
    <!-- 竖屏短剧帧：9:16 圆角竖框，短剧的形式语言本身 -->
    <path d="M358,218 L558,218 C602.18,218 638,253.82 638,298 L638,774 C638,818.18 602.18,854 558,854 L358,854 C313.82,854 278,818.18 278,774 L278,298 C278,253.82 313.82,218 358,218 Z" fill="#3B0E07"/>
    <!-- 播放三角：圆端点，底色透出 = 播放键在暗屏上亮着 -->
    <path d="M390,464 L390,608 Q390,628 407.34,618.03 L532.66,545.97 Q550,536 532.66,526.03 L407.34,453.97 Q390,444 390,464 Z" fill="#FF7A6E"/>
  </g>
</svg>
