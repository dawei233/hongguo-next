name: build-android

# ═══════════════════════════════════════════════════════════════════════════
# 安卓端 CI 构建链（docs/ARCHITECTURE.md §6 矩阵的 core-test + core-lib
# android/ndk 腿 + android-build 的合体实现；容器无 Java/Android SDK/NDK，
# APK 只能在 GitHub Actions 构建 —— 这就是本文件存在的理由）。
#
# 链路：bridge/go（cgo）→ NDK 交叉编译 → libhncore_android.so
#       → apps/android/android/app/src/main/jniLibs/arm64-v8a/
#       → flutter build apk --release（FFI 契约：DuanjuRequest/DuanjuFree，
#         dart 侧绑定 apps/android/lib/core_bridge.dart，ABI 不得改动）
#
# ★ 硬性纪律（教训来自上游 guoapp-android 的 .github/workflows/build.yml 假绿）：
#   上游把 flutter pub get / dart format / dart analyze / flutter test /
#   go test -race 全部带 continue-on-error: true，步骤失败也显示绿。
#   本文件任何步骤【不得】出现 continue-on-error；每步失败必须让 job 红。
#
# 本地复现（有 SDK 的机器；容器无 Java/SDK/NDK 只能跑 ① 的替代冒烟）：
#   # ① 内核 .so（需 NDK 28.2.13676358 = r28c，脚本内部自带版本断言 + ELF/符号校验）
#   export ANDROID_NDK_HOME=~/Android/Sdk/ndk/28.2.13676358
#   bash scripts/build-android-core.sh
#   # ② Dart 门禁
#   cd apps/android
#   flutter pub get
#   flutter analyze          # 冻结基线 106 条（0 error/6 warning/100 info，见 §7 M4）；纯跑会 exit 1
#   flutter test             # vendored 上游基线含失败用例（见 §7 M4）；纯跑会 exit 1
#   # ③④ APK
#   cd android && gradle wrapper --gradle-version 9.3.1   # vendor 状态无 gradlew（被 .gitignore 排除）
#   cd .. && flutter build apk --release
#   unzip -l build/app/outputs/flutter-apk/app-release.apk | grep libhncore_android.so
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'core/**'
      - 'bridge/**'
      - 'scripts/build-android-core.sh'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  # ⑤ 发布到 preview Release 需要：gh release create/upload 写 contents。
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # NDK 钉死 r28c。版本号 28.2.13676358 与 vendored 的
  # apps/android/android/app/build.gradle.kts（ndkVersion = "28.2.13676358"）
  # 完全一致：Go cgo 交叉编译与 Gradle 打包必须共用同一套 NDK 工具链，
  # 否则 .so 与 APK 内的其它 native 库会来自不同工具链。
  # （官方 wiki 实证：r28c ↔ 28.2.13676358；r28c 已转入 unsupported 页，
  #   但 vendored build.gradle.kts 钉的就是它，未经契约变更不得漂移。）
  HN_NDK_VERSION: '28.2.13676358'
  HN_NDK_RELEASE: 'r28c'
  # API level = minSdk（build.gradle.kts defaultConfig.minSdk = 26），
  # 决定用 NDK 的哪个 aarch64-linux-android<API>-clang 包装器。
  HN_ANDROID_API: '26'
  # Flutter/Dart 钉在 vendor 验证基线（本仓 vendor 时实测：Flutter 3.47.4 stable /
  # Dart 3.13.3，flutter test 与上游基线零回归；pubspec environment: >=3.12.0 <4.0.0）。
  HN_FLUTTER_VERSION: '3.47.4'
  HN_GO_VERSION: '1.24.x'      # docs/ARCHITECTURE.md §6 矩阵（go.mod go 1.24.1）
  HN_GRADLE_VERSION: '9.3.1'   # gradle-wrapper.properties 的 distributionUrl 一致

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # core CI：§6 矩阵的 core-test（Windows 必跑：boxes.go 字节级操作在 Windows
  # 的换行/路径/Rename 语义差异会真实咬人）+ 纯 Go 内核对 Android 的交叉编译冒烟。
  # 门禁形态说明：vendored 代码有 2 个文件不过 gofmt（hls_playlist_detect_test.go、
  # hongguo_finalize_test.go，B 原样搬入），所以这里不放 gofmt 门禁，只放 vet+test。
  # ─────────────────────────────────────────────────────────────────────────
  core-test:
    name: core-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.HN_GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: go vet ./...
        run: go vet ./...

      # 全部用本地 fixture，禁止联网（§6）；含 vendor 进来的 B 的 27 个测试文件
      - name: go test -race ./...
        run: go test -race ./...

      # 纯 Go 内核（core/ 非 cgo）对 Android 的交叉编译冒烟：CGO_ENABLED=0 无需 NDK，
      # 任何 runner 都能跑。bridge/go 的 cgo 交叉编译需要 NDK，见 android-build ①。
      # 只测 arm64：真实手机全是 arm64；GOOS=android 的 amd64 需要 cgo 外部链接
      # （CI 首跑实测报 "requires external (cgo) linking, but cgo is not enabled"），
      # 而 arm64 不需要 —— 这不是退化，是 Go 对这两个 GOARCH 的链接要求本就不同。
      - name: android 纯 Go 交叉编译冒烟（CGO_ENABLED=0）
        if: runner.os == 'Linux'
        run: |
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...

  # ─────────────────────────────────────────────────────────────────────────
  # android-build：① NDK 交叉编译 .so → ② Dart 门禁 → ③ Release APK → ④ 上传。
  # ─────────────────────────────────────────────────────────────────────────
  android-build:
    name: android-build (arm64-v8a APK)
    needs: core-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 释放 runner 磁盘空间。CI 第五跑实测：Android SDK + NDK r28c（约 3GB）+
      # Gradle 缓存 + Java/Go/Node 工具链把 14GB 吃满，Dart 编译写 app.dill 时
      # 报 "No space left on device, errno = 28"。
      # 清掉本构建用不到的大目录；保留 Android SDK（只删用不到的旧 NDK）。
      - name: 释放 runner 磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/* \
            /usr/lib/jvm/temurin-8-jdk-amd64 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      # 工具链：Java（Gradle 9 / AGP 9.1 需要）+ NDK r28c（钉死，与 vendored
      # build.gradle.kts 的 ndkVersion 一致）。
      # 不用 android-actions/setup-android@v3：CI 首跑实测它在 sdkmanager 安装
      # 旧版 "tools" 包时报 "Failed to find package 'tools'"（该包已被 Google
      # 移除，action 还没跟进）。ubuntu runner 本就预装 Android SDK + cmdline-tools，
      # 需要的平台/构建工具在 ③ 前用 sdkmanager 显式装。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c        # = 28.2.13676358
          link-to-sdk: true        # AGP 直接命中 $ANDROID_SDK_ROOT/ndk/28.2.13676358，免二次下载

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.HN_GO_VERSION }}
          cache-dependency-path: core/go.sum

      # ① 用 NDK 交叉编译 bridge/go → libhncore_android.so（android/arm64），
      #    落到 apps/android/android/app/src/main/jniLibs/arm64-v8a/。
      #    脚本内部自带：NDK 版本断言（Pkg.Revision 必须等于 28.2.13676358）、
      #    -buildmode=c-shared、ELF 形态校验（AArch64 + DYN）、
      #    动态符号表校验（DuanjuRequest / DuanjuFree 必须导出）。
      #    任一失败即 exit 1 —— job 红。
      - name: ① NDK 交叉编译 Go 内核 → jniLibs/arm64-v8a/libhncore_android.so
        run: bash scripts/build-android-core.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # Flutter 工具链：钉在 vendor 验证基线 3.47.4（Dart 3.13.3）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.HN_FLUTTER_VERSION }}
          channel: stable
          cache: true

      # gradle wrapper 引导：apps/android/android/.gitignore 排除了 gradlew、
      # gradlew.bat、gradle-wrapper.jar（vendor 状态没有 wrapper），而
      # settings.gradle.kts 又要求 local.properties 里有 flutter.sdk ——
      # 所以先写 local.properties（gitignored，不入仓），再用钉死的 Gradle 9.3.1
      # 生成 wrapper（与 gradle-wrapper.properties 的 distributionUrl 一致）。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Android 平台/构建工具：runner 预装的 SDK 未必带 AGP 需要的版本，
      # 用 sdkmanager 显式装（接受许可）。不用 android-actions/setup-android（见上）。
      - name: 安装 AGP 需要的平台与构建工具
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: 引导 gradle wrapper（vendor 状态无 gradlew；生成物已被 .gitignore 排除）
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties
          gradle wrapper --gradle-version "$HN_GRADLE_VERSION" --distribution-type all
        working-directory: apps/android/android

      # ② Dart 侧门禁。全部无 continue-on-error：
      #    pub get 失败 → 红；analyze/test 失败 → 红（对照冻结基线，见步骤内说明）。
      - name: ② flutter pub get
        run: flutter pub get
        working-directory: apps/android

      # analyze 对照冻结基线：vendored 基线为 106 条（0 error / 6 warning / 100 info，
      # 2026-10-15 于 Flutter 3.47.4 实测；docs/ARCHITECTURE.md §7 M4：
      # “dart analyze 与上游同为 106 条”，全绿不可达）。
      # 纯跑 flutter analyze 恒 exit 1 —— 那是基线，不是回归；分级别超出基线
      # （error>0、warning>6、总数>106）才是回归，必须红。基线只允许被显式调低。
      - name: ② flutter analyze（对照冻结基线 0error/6warning/106：超出即失败）
        run: |
          flutter analyze > analyze.log 2>&1 || true
          # 防假绿：analyze 崩溃（exit 255 等）时日志里没有任何结论行，
          # 计数会得 0 —— 必须先断言"产出了结论"，否则按失败处理。
          if ! grep -qE 'issues found|No issues found' analyze.log; then
            echo "---- flutter analyze 未产出结论（崩溃/中断），按失败处理 ----"
            cat analyze.log
            exit 1
          fi
          echo "---- flutter analyze 输出（尾部 30 行）----"
          tail -30 analyze.log
          TOTAL=$(grep -cE '^[[:space:]]*(info|warning|error) •' analyze.log || true)
          ERRORS=$(grep -cE '^[[:space:]]*error •' analyze.log || true)
          WARNINGS=$(grep -cE '^[[:space:]]*warning •' analyze.log || true)
          echo "analyzer：error=${ERRORS:-0} / warning=${WARNINGS:-0} / total=${TOTAL:-0}（冻结基线：error 0 / warning 6 / total 106）"
          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::flutter analyze 出现 error 级问题（冻结基线为 0）—— 回归，必须修"
            exit 1
          fi
          if [ "${WARNINGS:-0}" -gt 6 ]; then
            echo "::error::flutter analyze warning ${WARNINGS} 条超过冻结基线 6 —— 出现基线外新问题"
            exit 1
          fi
          if [ "${TOTAL:-0}" -gt 106 ]; then
            echo "::error::flutter analyze 共 ${TOTAL} 条，超过冻结基线 106 —— 出现基线外新问题"
            exit 1
          fi
        working-directory: apps/android

      # ②b 分析器覆盖 integration_test（显式，不依赖 flutter analyze 的隐式范围）
      #
      # 背景：`flutter test` **只扫 test/**，不含 integration_test/。
      # B7a 删除 `AppBottomNavigation` 时，`flutter test` 全绿，但
      # `integration_test/appearance_test.dart:78` 仍在引用它 —— 该编译错误
      # 不会被测试拦住。虽然 `flutter analyze` 很可能覆盖 integration_test
      # （CI 门禁含 error 计数，理论上会红），但"是否覆盖"依赖隐式行为。
      # 这里显式跑一次，使覆盖**确定且可核对**。
      #
      # 注意：integration_test 的基线是 **0 issue**，不与 test/ 的 106 冻结基线
      # 挂钩 —— 两套基线不可混算。
      #
      # 不跑 `flutter test integration_test/`：那是 on-device 测试，
      # 需要设备/模拟器，CI 里跑不了（搭 emulator 成本远超收益）。
      - name: ②b dart analyze integration_test（显式覆盖，基线 0）
        run: |
          dart analyze integration_test/ > integration_analyze.log 2>&1 || true
          # 防假绿：崩溃时日志无结论行，必须先断言产出了结论。
          if ! grep -qE 'issues found|No issues found' integration_analyze.log; then
            echo "---- dart analyze integration_test 未产出结论（崩溃/中断），按失败处理 ----"
            cat integration_analyze.log
            exit 1
          fi
          echo "---- dart analyze integration_test 输出 ----"
          cat integration_analyze.log
          # 与 test/ 的冻结基线不同：integration_test 基线为 0 error。
          if grep -qE '^[[:space:]]*error' integration_analyze.log; then
            echo "::error::integration_test 存在 error 级问题（基线为 0）"
            exit 1
          fi
        working-directory: apps/android

      # test 对照冻结失败基线：上游本身有失败用例
      # （docs/ARCHITECTURE.md §7 M4：“上游本身有 7 个失败用例，全绿不是可达标准”）。
      # 纯跑 flutter test 恒 exit 1 —— 失败数超过冻结基线 7 才是回归，必须红。
      # 失败明细始终完整打印，回归与否一目了然。
      - name: ② flutter test（对照冻结失败基线：超过基线即失败）
        run: |
          flutter test > test.log 2>&1 || true
          # 防假绿：test 崩溃/中断（超时、tool exit 255 等）时日志里没有结论行，
          # 失败计数会得 0 —— 必须先断言"产出了结论"，否则按失败处理。
          # 注意两种结论格式：本地（有 TTY）是 "Some tests failed."；
          # CI（无 TTY，compact reporter）是 "155 tests passed, 7 failed, 2 skipped."
          # —— CI 第四跑实测只匹配前者导致误判"未产出结论"而假红。
          if ! grep -qE 'All tests passed!|Some tests failed|[0-9]+ tests passed' test.log; then
            echo "---- flutter test 未产出结论（崩溃/中断），按失败处理 ----"
            tail -40 test.log
            exit 1
          fi
          echo "---- flutter test 失败明细 ----"
          grep -E '\[E\]' test.log || echo "（无失败用例）"
          echo "---- 尾部 15 行 ----"
          tail -15 test.log
          # 失败数两种格式各取一次：
          #   TTY:      "01:04 +155 ~2 -7: Some tests failed."   → " -7:"
          #   compact:  "155 tests passed, 7 failed, 2 skipped." → "7 failed"
          FAILS=$(grep -oE ' -[0-9]+:' test.log | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "${FAILS}" ]; then
            FAILS=$(grep -oE '[0-9]+ failed' test.log | tail -1 | grep -oE '[0-9]+' || true)
          fi
          echo "flutter test 失败数=${FAILS:-0}（vendored 上游冻结基线 7，见 ARCHITECTURE.md §7 M4）"
          if [ "${FAILS:-0}" -gt 7 ]; then
            echo "::error::flutter test 失败数 ${FAILS} 超过冻结基线 7 —— 出现基线外回归"
            exit 1
          fi
        working-directory: apps/android

      # ③ Release APK。无 key.properties 时按 vendored build.gradle.kts 回退
      #    debug 签名（可安装、可校验；正式上架前注入真实 keystore）。
      #
      #    ⚠ `--target-platform android-arm64` 是**必需的**，不是优化：
      #    内核 .so 由步骤 ① 只编 arm64（`GOARCH=arm64`、`HN_ABI_DIR=arm64-v8a`）。
      #    裸 `flutter build apk` 会产出 arm64-v8a + armeabi-v7a + x86_64 三个
      #    ABI，后两者**只有 libflutter.so、没有 libhncore_android.so** ——
      #    那些设备**能装上、一打开就崩**（`DynamicLibrary.open(
      #    'libhncore_android.so')` 失败）。
      #
      #    实测（2026-10-16 解包 preview 包）：v7a/x86_64 的 libflutter.so 在、
      #    libhncore_android.so 不在。危害比"装不上"更隐蔽 —— 装上了才崩。
      #    限定 ABI 后，APK 只为内核真正支持的架构分发。
      #    产物名 `hongguo-next-arm64-v8a.apk` 本也只承诺 arm64。
      - name: ③ flutter build apk --release（限定 arm64，与内核 .so 的 ABI 对齐）
        run: flutter build apk --release --target-platform android-arm64
        working-directory: apps/android

      # ④ 产物校验 + 上传 APK + 校验和。任何断言失败即红。
      #    断言 jniLibs 的 libhncore_android.so 真的进了 APK（§6 android-build 的
      #    “断言 jniLibs 内含 libhncore_android.so”），并校验签名可验。
      - name: ④ 校验 APK（内核 .so 已装入 + 签名可验）
        run: |
          APK="apps/android/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || { echo "::error::APK 不存在：$APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libhncore_android.so" \
            || { echo "::error::APK 缺 lib/arm64-v8a/libhncore_android.so —— FFI 内核没有进包"; exit 1; }
          # ABI 一致性：**每个声明了 libflutter.so 的 ABI，都必须同时有
          # libhncore_android.so**。否则那些设备装上后会 dlopen 失败（崩），
          # 而只断言"arm64 那份存在"的做法**抓不到**这种半残包 ——
          # 2026-10-16 实测 preview 包就是这样溜过 CI 的（v7a/x86_64 缺内核）。
          for abi_dir in $(unzip -l "$APK" | awk '/lib\/.*\/libflutter.so$/ {sub(/.*lib\//,""); sub(/\/libflutter.so.*/,""); print}' | sort -u); do
            unzip -l "$APK" | grep -q "lib/$abi_dir/libhncore_android.so" \
              || { echo "::error::ABI $abi_dir 有 libflutter.so 却缺 libhncore_android.so —— 该架构设备装上会崩"; exit 1; }
          done
          echo ">> ABI 一致性检查通过"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            || { echo "::error::apksigner verify 失败"; exit 1; }
          echo ">> APK 校验通过"
          unzip -l "$APK" | grep "libhncore_android.so"

      - name: ④ 生成校验和并上传 artifact
        run: |
          APK="apps/android/build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p dist
          cp "$APK" dist/hongguo-next-arm64-v8a.apk
          (cd dist && sha256sum hongguo-next-arm64-v8a.apk > SHA256SUMS.txt)
          echo ">> SHA256SUMS.txt"
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: |
            dist/hongguo-next-arm64-v8a.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          # 账号级 artifact 配额只有 500MB 且重算滞后 6-12h（CI 第六跑实测
          # "Artifact storage quota has been hit"）。构建产物给 7 天足够下载，
          # 过期自动释放，不再长期占用配额。
          retention-days: 7

      # ⑤ 发布到滚动的 preview Release。artifact 7 天就过期、且埋在 Actions 里
      # 不易找，Release 才是安装包的固定住址 —— 固定下载地址：
      #   https://github.com/dawei233/hongguo-next/releases/tag/preview
      #
      # **push 与手动触发都发布**（2026-10-16 调整）：原先是 dispatch-only，
      # 但用户只看 Release、而 push 才是常态 —— 结果是"常态路径不发布，
      # Release 长期滞后"（实测用户拿到的包比修复提交早了一个多小时，
      # 我不得不手动 dispatch 一次才补上）。
      #
      # 不会有 release 噪音：① 同一个 `preview` tag 用 `--clobber` 覆盖资产，
      # 不新建 release；② push 触发器已按 paths 过滤（仅 apps/android、
      # core、bridge 等改动才跑），不是每次提交都发；③ 本步骤在 ④ 校验之后，
      # 只有**全绿**的构建才会走到这里（失败时前面已 exit 1）。
      - name: ⑤ 发布到 preview Release（push 与手动触发都发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view preview --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create preview \
              --repo "$GITHUB_REPOSITORY" \
              --title "红果 Next — 安卓 arm64 最新预览版" \
              --notes "滚动更新的安卓预览版（arm64-v8a）。每次 CI 构建成功后覆盖本页资产（同一 tag，不新建 release）。固定下载地址即本页；正式版本另行打 tag 发布。来源链路与上游署名见仓库 NOTICE（GPL-3.0）。"
          fi
          gh release upload preview dist/hongguo-next-arm64-v8a.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo ">> 已发布到 preview Release（覆盖旧资产）"
